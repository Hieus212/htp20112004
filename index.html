<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 3 - Dịch Vụ Chăm Sóc Thú Cưng</title>
    <style>
        .service {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: 300px;
            text-align: center;
        }
        .service img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Dịch Vụ Chăm Sóc Thú Cưng</h1>

    <div id="services-container"></div> <!-- Container để chứa các dịch vụ -->

    <script>
        // Tạo chuỗi JSON chứa thông tin các dịch vụ
        const services = [
            {
                name: "Tắm cho thú cưng",
                image: "https://via.placeholder.com/300x200.png?text=Service+1",
                description: "Dịch vụ tắm sạch sẽ và chăm sóc lông cho thú cưng của bạn.",
                price: "200,000 VND"
            },
            {
                name: "Cắt tỉa lông",
                image: "https://via.placeholder.com/300x200.png?text=Service+2",
                description: "Cắt tỉa lông, tạo kiểu cho thú cưng để chúng luôn gọn gàng và xinh đẹp.",
                price: "150,000 VND"
            },
            {
                name: "Tiêm phòng",
                image: "https://via.placeholder.com/300x200.png?text=Service+3",
                description: "Cung cấp các loại vắc-xin cần thiết cho thú cưng của bạn.",
                price: "100,000 VND"
            },
            {
                name: "Chăm sóc sức khỏe",
                image: "https://via.placeholder.com/300x200.png?text=Service+4",
                description: "Khám sức khỏe định kỳ cho thú cưng và tư vấn về dinh dưỡng.",
                price: "300,000 VND"
            }
        ];

        // Sử dụng vòng lặp while để in thông tin các dịch vụ
        let i = 0;
        const container = document.getElementById("services-container");

        while (i < services.length) {
            const service = services[i];
            
            // Tạo phần tử div cho mỗi dịch vụ
            const serviceDiv = document.createElement("div");
            serviceDiv.classList.add("service");

            // Tạo nội dung cho div
            serviceDiv.innerHTML = `
                <h2>${service.name}</h2>
                <img src="${service.image}" alt="${service.name}">
                <p><strong>Mô tả:</strong> ${service.description}</p>
                <p><strong>Giá:</strong> ${service.price}</p>
            `;

            // Thêm phần tử div vào container
            container.appendChild(serviceDiv);

            // Tăng chỉ số i
